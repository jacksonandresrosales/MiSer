<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#6551c6">
  <title>MiSer · Vista previa Kotlin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #f8f7f2; }
    #miser { position: fixed; inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); overflow: hidden; }
    @media (prefers-color-scheme: dark) { body { background: #10131b; } }
  </style>
</head>
<body>
  <div id="miser"></div>
  <noscript>Activa JavaScript para abrir MiSer.</noscript>
  <script src="miser.js"></script>
</body>
</html>
