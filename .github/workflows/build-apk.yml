name: Build Android APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test application
        run: npm test

      - name: Test Firestore security rules without touching Firebase production
        run: npx --yes --package firebase-tools@15.32.1 firebase emulators:exec --only firestore --project demo-miser "npm run test:rules"

      - name: Build Web Application
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_APP_CHECK_ENABLED: ${{ vars.VITE_FIREBASE_APP_CHECK_ENABLED || 'false' }}
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APP_CHECK_SITE_KEY }}
          VITE_FIRESTORE_INCREMENTAL_SYNC: ${{ vars.VITE_FIRESTORE_INCREMENTAL_SYNC || 'false' }}
        run: |
          node --input-type=module -e "const keys = ['API_KEY', 'AUTH_DOMAIN', 'PROJECT_ID', 'STORAGE_BUCKET', 'MESSAGING_SENDER_ID', 'APP_ID'].map(k => 'VITE_FIREBASE_' + k); const missing = keys.filter(k => !process.env[k]?.trim()); if (missing.length) throw new Error('Falta configurar Firebase: ' + missing.join(', '));"
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const plugins = JSON.parse(fs.readFileSync('android/app/src/main/assets/capacitor.plugins.json', 'utf8')); for (const pkg of ['@capacitor/filesystem', '@capacitor/share', '@capacitor-firebase/authentication']) assert.ok(plugins.some(p => p.pkg === pkg), 'Plugin Android no registrado: ' + pkg); const config = JSON.parse(fs.readFileSync('android/app/src/main/assets/capacitor.config.json', 'utf8')); assert.equal(config.plugins.FirebaseAuthentication.skipNativeAuth, true); assert.ok(config.plugins.FirebaseAuthentication.providers.includes('google.com'));"

      - name: Restore existing signing certificate
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          MISER_DEBUG_KEYSTORE: ${{ runner.temp }}/miser-debug.keystore
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64" || { echo 'Falta ANDROID_DEBUG_KEYSTORE_BASE64: no se generará una firma temporal.'; exit 1; }
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$MISER_DEBUG_KEYSTORE"
          chmod 600 "$MISER_DEBUG_KEYSTORE"
          echo "MISER_DEBUG_KEYSTORE=$MISER_DEBUG_KEYSTORE" >> "$GITHUB_ENV"

      - name: Build optimized Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --stacktrace

      - name: Verify and prepare APK
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/MiSer.apk
          APK_ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test "$("$APK_ANALYZER" manifest debuggable artifacts/MiSer.apk)" = 'false'
          "$APK_ANALYZER" manifest print artifacts/MiSer.apk > artifacts/manifest.xml
          grep -q 'android:allowBackup="false"' artifacts/manifest.xml
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APK_SIGNER" verify --verbose --print-certs artifacts/MiSer.apk | tee artifacts/certificado.txt
          keytool -exportcert -keystore "$MISER_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/miser-signing.cer"
          EXPECTED_CERT_SHA256=$(sha256sum "$RUNNER_TEMP/miser-signing.cer" | cut -d ' ' -f 1)
          grep -Fi "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" artifacts/certificado.txt
          EXPECTED_CERT_SHA1=$(sha1sum "$RUNNER_TEMP/miser-signing.cer" | cut -d ' ' -f 1)
          node --input-type=module - "$EXPECTED_CERT_SHA1" <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const config = JSON.parse(fs.readFileSync('android/app/google-services.json', 'utf8'));
          const capacitor = JSON.parse(fs.readFileSync('android/app/src/main/assets/capacitor.config.json', 'utf8'));
          assert.equal(config.project_info.project_id, process.env.FIREBASE_PROJECT_ID, 'Firebase web y Android deben usar el mismo proyecto');
          const client = config.client.find(c => c.client_info.android_client_info.package_name === capacitor.appId);
          assert.ok(client, 'Falta la aplicación Android en Firebase');
          assert.ok(client.oauth_client.some(c => c.client_type === 1 && c.android_info.package_name === capacitor.appId && c.android_info.certificate_hash.toLowerCase() === process.argv[2]), 'La SHA-1 OAuth no coincide con la firma de la APK');
          const webClient = client.oauth_client.find(c => c.client_type === 3);
          assert.ok(webClient, 'Falta el cliente OAuth web para obtener el ID token de Google');
          const generatedResources = fs.globSync('android/app/build/generated/res/**/values.xml').map(path => fs.readFileSync(path, 'utf8'));
          assert.ok(generatedResources.some(xml => xml.includes(webClient.client_id) && xml.includes(client.client_info.mobilesdk_app_id)), 'No se generó la configuración Firebase y OAuth Android');
          NODE
          (cd artifacts && sha256sum MiSer.apk > MiSer.apk.sha256)
          echo 'APK release: depuración y backup desactivados; firma, Firebase y OAuth verificados. Validar huella, cifrado y consumo en un teléfono.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiSer-Android
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish public Android update channel
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-android.mjs
