<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0c0b" />
    <script>
      try {
        if (localStorage.getItem('miser-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f4f0')
        }
      } catch { /* Browser storage may be disabled. */ }
    </script>
    <meta name="description" content="Un espacio personal para cuidar tu dinero y tus planes." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MiSer · Tus finanzas</title>
    <style>html, body { background: #0d0c0b; } html[data-theme="light"], html[data-theme="light"] body { background: #f6f4f0; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
