<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f2" />
    <script>
      try {
        if (localStorage.getItem('miser-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#10131b')
        }
      } catch { /* Browser storage may be disabled. */ }
    </script>
    <meta name="description" content="Un espacio personal para cuidar tu dinero y tus planes." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MiSer · Finanzas con calma</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
